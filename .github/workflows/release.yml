name: Release

# Pushing a tag v<version> builds unsigned installers for Windows, macOS and Linux and puts
# them on a draft GitHub Release with a SHA-256 checksums file and the version's CHANGELOG.md
# section. Publishing the draft is a manual step. CONTRIBUTING.md#releasing has the procedure.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Self-test the release check
        run: node --test scripts/check-release.test.mjs

      - name: Tag, versions and changelog agree
        id: check
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME" --notes-out release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust-targets: wasm32-unknown-unknown
            bundles: target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on older glibc versions too.
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: wasm32-unknown-unknown
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm --dir app install --frozen-lockfile

      # Builds only; the release is assembled by the publish job once every platform is done.
      # `tauri build` runs the app's beforeBuildCommand (`pnpm build`, WASM included).
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect installers and write checksums
        run: |
          mkdir dist
          # "Chords & Scales_0.1.0_x64-setup.exe" -> "Chords-and-Scales_0.1.0_x64-setup.exe":
          # GitHub would mangle the spaces and "&" in asset names otherwise.
          find artifacts/bundles-* -type f -print0 | while IFS= read -r -d '' f; do
            name=$(basename "$f" | sed -e 's/ & /-and-/g' -e 's/ /-/g')
            if [ -e "dist/$name" ]; then echo "::error::duplicate asset $name"; exit 1; fi
            cp "$f" "dist/$name"
          done
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Create or update the draft release
        run: |
          title="Chords & Scales $TAG"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: refresh the assets of the existing draft, never touch a published release.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::release $TAG is already published"
              exit 1
            fi
            gh release edit "$TAG" --title "$title" --notes-file artifacts/release-notes/release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag "${flags[@]}" \
              --title "$title" --notes-file artifacts/release-notes/release-notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
