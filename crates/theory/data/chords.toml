# Built-in chord catalog (SPEC §4.3, ADR-5, ADR-27). Embedded into the binary at build time.
#
# One [[chord]] table per chord:
#   id           lowercase kebab-case, unique; what settings and user files refer to
#   name         display name, unique in the catalog
#   symbol       the canonical suffix, the part after the root ("m7" in "Cm7"), in ASCII: write
#                "b" and "#" (the app shows ♭ and ♯). Only the major triad has the empty suffix.
#   aliases      other suffixes the symbol parser reads as this chord (optional). Matched
#                case-sensitively: "M7" is major seventh, "m7" minor seventh. No suffix may
#                mean two chords, whether it is a symbol or an alias.
#   jazz_symbol  the suffix in the Jazz display style, only where it differs from `symbol`
#   family       the group the chord is listed under; families appear in file order
#   intervals    degree labels from the root: start at "1", strictly ascending, below two
#                octaves (so "9", "#11" and "13" are fine), at least two, and no two on one
#                pitch class. Write the label the chord means: "#9" in 7#9, "b5" in m7b5.
#
# The intervals are the chord's full stack. The natural 11 is left out of chords with a major
# third (13, maj13), where it clashes; it stays in chords with a minor third (m11, m13).
# Voicings may leave tones out; the catalog doesn't.
#
# `cargo test -p theory` checks every entry (builtin_chords_are_valid).

