# Built-in scale catalog (SPEC §4.2, ADR-5, ADR-20). Embedded into the binary at build time.
#
# One [[scale]] table per scale:
#   id         lowercase kebab-case, unique; what settings and user files refer to
#   name       display name
#   aliases    other names (optional)
#   family     the group the scale is listed under; families appear in file order
#   intervals  degree labels from the root: start at "1", strictly ascending, within the octave.
#              Write the label the scale means: "#4" in Lydian, "b5" in Locrian.
#
# `cargo test -p theory` checks every entry (builtin_scales_are_valid).

# --- Diatonic modes: the modes of the major scale, in mode order --------------------------

[[scale]]
id = "major"
name = "Major"
aliases = ["Ionian"]
family = "Diatonic modes"
intervals = ["1", "2", "3", "4", "5", "6", "7"]

[[scale]]
id = "dorian"
name = "Dorian"
family = "Diatonic modes"
intervals = ["1", "2", "b3", "4", "5", "6", "b7"]

[[scale]]
id = "phrygian"
name = "Phrygian"
family = "Diatonic modes"
intervals = ["1", "b2", "b3", "4", "5", "b6", "b7"]

[[scale]]
id = "lydian"
name = "Lydian"
family = "Diatonic modes"
intervals = ["1", "2", "3", "#4", "5", "6", "7"]

[[scale]]
id = "mixolydian"
name = "Mixolydian"
family = "Diatonic modes"
intervals = ["1", "2", "3", "4", "5", "6", "b7"]

[[scale]]
id = "aeolian"
name = "Natural minor"
aliases = ["Aeolian", "Minor"]
family = "Diatonic modes"
intervals = ["1", "2", "b3", "4", "5", "b6", "b7"]

[[scale]]
id = "locrian"
name = "Locrian"
family = "Diatonic modes"
intervals = ["1", "b2", "b3", "4", "b5", "b6", "b7"]

