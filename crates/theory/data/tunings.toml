# Built-in tunings (SPEC §5.1, ADR-5, ADR-21). Embedded into the theory core at build time.
#
# One [[tuning]] table per preset:
#   id    lowercase kebab-case, `<kind>-<strings>-<name>` for built-ins (`guitar-6-drop-d`)
#   name  shown in the UI, next to the instrument and string count
#   kind  "guitar" or "bass"
#   notes the open strings with octaves (C4 = middle C), lowest string first, 4 to 9 of them
#
# User tunings use the same format; one with a built-in id replaces the built-in.
# `cargo test -p theory` checks every entry here (`builtin_tunings_are_valid`).

# Guitar, 6 strings

[[tuning]]
id = "guitar-6-standard"
name = "Standard"
kind = "guitar"
notes = ["E2", "A2", "D3", "G3", "B3", "E4"]

[[tuning]]
id = "guitar-6-drop-d"
name = "Drop D"
kind = "guitar"
notes = ["D2", "A2", "D3", "G3", "B3", "E4"]

[[tuning]]
